<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Holding The Ball</title>
</head>
<body>
    <div class="container">
        <div class="sideBoard">
            <div id="board">0000</div>
            <div id="play">PLAY</div>
            <div id="mode">
                <input type="checkbox" id="swap">
                <label  id="back" for="swap"></label>
            </div>
            <div class="line">
                    <div id="easy">Easy</div>
                    <div id="hard">Hard</div>
                </div>
        </div>
        <div class="display">
            <div id="ball"></div>
            <div id="number"></div>
        </div>
    </div>
</body>
</html>
